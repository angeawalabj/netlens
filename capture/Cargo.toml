[package]
name = "netlens-capture"
version = "0.1.0"
edition = "2021"
description = "NetLens live packet capture engine — libpcap capture, protocol parsers, anomaly detection, WebSocket streaming"
license = "Apache-2.0"

[[bin]]
name = "netlens-capture"
path = "src/main.rs"

[dependencies]
pcap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
